<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>간접조명 실측</title><link rel="stylesheet" href="lighting.css?v=5"></head><body>
<main><header><a href="./index.html">‹ 현장관리</a><span>간접조명 실측</span><h1 id="siteTitle">실측 목록</h1><button id="refresh" aria-label="최신 목록 새로고침">새로고침</button></header>
<section id="login" hidden><label>접속키<input id="accessKey" type="password" autocomplete="current-password"></label><button id="loginBtn">접속</button></section>
<p id="message" role="status" aria-live="polite">실측 목록을 불러옵니다.</p>
<div id="workspace" hidden><section class="summary"><div><strong id="progress">0 / 0</strong><span>실측 완료</span></div><progress id="meter" value="0" max="1"></progress><small id="remaining"></small></section>
<div class="layout"><section class="listpanel"><nav><button data-filter="pending" class="chosen">남은 곳</button><button data-filter="done">완료</button><button data-filter="all">전체</button><button data-filter="excluded">제외</button></nav><div id="list"></div><button id="add" class="add">＋ 빠진 위치 추가</button></section>
<section id="editorPanel" hidden><form id="editor"><div class="editorTop"><button type="button" id="close">‹ 목록</button><small id="rowMeta"></small></div><small id="roomName"></small><h2 id="editTitle">실측 입력</h2><p id="productInfo" hidden></p>
<details id="locationFields"><summary>위치 이름 수정</summary><label>공간<input name="room" maxlength="250" required></label><label>설치 위치<input name="location" maxlength="250" required></label></details>
<h3>길이 <small>mm</small></h3><div id="segments"></div><div class="lengthTools"><button type="button" id="addSegment">＋ 구간</button><strong id="total"></strong></div>
<details id="noteFields"><summary>메모가 필요할 때</summary><textarea name="note" maxlength="2000" placeholder="특이사항만 남겨주세요"></textarea></details>
<details class="exclude"><summary>시공하지 않는 위치</summary><label>사유<input name="reason" maxlength="250"></label><button type="button" id="skip">시공 안 함</button><button type="button" id="remove">중복 위치 삭제</button></details>
<div class="savebar"><small id="saveState">길이를 입력하고 저장하세요</small><div><button type="button" id="draftSave">임시 저장</button><button class="primary" type="submit">완료 · 다음 위치</button></div></div>
</form></section></div></div></main><script src="lighting.js?v=5"></script></body></html>
