<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASIFILL Progress</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    color: #16181d;
    padding: 4px;
  }
  .wrap {
    max-width: 860px; margin: 0 auto;
    border: 1px solid #ececee; border-radius: 10px;
    padding: 10px 16px 11px;
    background: #ffffff;
  }
  .n { font-variant-numeric: tabular-nums; }

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .info { font-size: 11.5px; color: #9aa0a8; letter-spacing: -0.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info b { color: #16181d; font-weight: 700; }
  .info .t { font-size: 12px; margin-right: 6px; }
  .info .sep { color: #d5d7da; margin: 0 5px; }
  .pct { font-size: 19px; font-weight: 800; letter-spacing: -0.6px; white-space: nowrap; }

  .bar { margin-top: 8px; height: 2px; background: #ececee; position: relative; border-radius: 1px; }
  .fill {
    position: absolute; left: 0; top: 0; height: 2px; width: 0%;
    background: #16181d; border-radius: 1px;
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }

  @media (max-width: 560px) {
    body { padding: 2px; }
    .wrap { padding: 9px 12px 10px; }
    .info { font-size: 10.5px; }
    .info .t { font-size: 11px; }
    .pct { font-size: 16px; }
  }

  /* 다크 스킨 (?theme=dark) */
  body[data-theme="dark"] { background: transparent; }
  body[data-theme="dark"] .wrap { background: #101114; border-color: #202329; }
  body[data-theme="dark"] .info { color: #5c626b; }
  body[data-theme="dark"] .info b { color: #f5f6f7; }
  body[data-theme="dark"] .info .sep { color: #2a2d33; }
  body[data-theme="dark"] .pct { color: #f5f6f7; }
  body[data-theme="dark"] .bar { background: #23262c; }
  body[data-theme="dark"] .fill { background: #f5f6f7; }

  /* 다크모드 뷰어 대응: 주변이 어두우면 카드를 한 톤 띄움 (elevated) */
  @media (prefers-color-scheme: dark) {
    body[data-theme="dark"] .wrap { background: #1b1e24; border-color: #2b2f37; }
    body[data-theme="dark"] .bar { background: #2b2f37; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="info">
        <b class="t" id="title">프로젝트 진행</b><span id="detail"></span>
      </div>
      <span class="pct n" id="pctNum">0%</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

<script>
  // 기본 사용법 (날짜 기반 자동 진행 — 프로젝트당 1회 입력이 전부):
  //   ?start=2026-08-08&end=2026-11-13
  //   → 오늘 날짜 기준으로 퍼센트·남은 일수가 매일 자동 갱신됩니다.
  // 옵션:
  //   pct=42     : 수동 오버라이드 (실제 공정과 어긋날 때만)
  //   t=공사 진행 : 제목 변경
  //   theme=dark : 다크 카드
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "dark") document.body.dataset.theme = "dark";
  if (q.get("t")) document.getElementById("title").textContent = q.get("t");

  const startStr = q.get("start");
  const endStr = q.get("end");
  const today = new Date(); today.setHours(0, 0, 0, 0);

  // 진행률 기준: 착공일(start) → 준공일(end). 착공 전에는 % 대신 착공 카운트다운 표시.
  const s = startStr ? new Date(startStr + "T00:00:00") : null;
  const e = endStr ? new Date(endStr + "T00:00:00") : null;
  const preStart = s && !isNaN(s) && today < s && !q.has("pct");

  let pct = 0;
  if (q.has("pct")) {
    pct = Math.max(0, Math.min(100, parseFloat(q.get("pct"))));
  } else if (s && e && !isNaN(s) && !isNaN(e) && e > s) {
    pct = Math.max(0, Math.min(100, Math.round(((today - s) / (e - s)) * 100)));
  }

  const pctEl = document.getElementById("pctNum");
  if (preStart) {
    const dToStart = Math.round((s - today) / 86400000);
    pctEl.textContent = "착공 D-" + dToStart;
    pctEl.style.fontSize = "15px";
  } else {
    pctEl.textContent = pct + "%";
  }
  requestAnimationFrame(() => {
    document.getElementById("fill").style.width = pct + "%";
  });

  const fmt = (str) => {
    const d = new Date(str + "T00:00:00");
    return isNaN(d) ? "" : (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0");
  };
  let parts = [];
  if (startStr && endStr) parts.push(`착공 <b>${fmt(startStr)}</b> — 준공 예정 <b>${fmt(endStr)}</b>`);
  if (e && !isNaN(e)) {
    const left = Math.round((e - today) / 86400000);
    parts.push(left > 0 ? `준공까지 <b>${left}일</b>` : (left === 0 ? "<b>오늘 준공</b>" : "<b>준공 완료</b>"));
  }
  document.getElementById("detail").innerHTML =
    parts.length ? '<span class="sep">·</span>' + parts.join('<span class="sep">·</span>') : "";
</script>
</body>
</html>
