<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASIFILL Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    --didone:"Bodoni Moda",Didot,Georgia,"Times New Roman",serif;

    /* 앱 헤더와 같은 다크 글래스 — 노션이 밝든 어둡든 동일하게 읽힙니다 */
    --card:rgba(18,20,25,.86);
    --bd:rgba(255,255,255,.13);
    --sh: inset 0 1px 0 rgba(255,255,255,.10),
          0 1px 2px rgba(10,12,16,.16),
          0 4px 10px rgba(10,12,16,.18),
          0 12px 24px rgba(10,12,16,.20);
    --gloss: linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
    --txt:#f2f4f7; --txt2:rgba(255,255,255,.74); --txt3:rgba(255,255,255,.50);
    --div:rgba(255,255,255,.10);
    --track:rgba(255,255,255,.12);
    --fill: linear-gradient(90deg,#aeb6c0,#f4f6f8);
  }
  /* ?theme=light — 밝은 카드가 필요할 때만 */
  body[data-theme="light"] {
    --card:rgba(255,255,255,.62); --bd:rgba(255,255,255,.85);
    --sh: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(16,18,22,.06), 0 4px 10px rgba(16,18,22,.07), 0 12px 22px rgba(16,18,22,.07);
    --gloss: linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
    --txt:#16181d; --txt2:#5a616a; --txt3:#8b9199;
    --div:rgba(120,128,140,.16); --track:rgba(120,128,140,.20);
    --fill: linear-gradient(90deg,#454b54,#16181d);
  }

  /* 배경 없음 — 노션 페이지 배경이 그대로 비칩니다 */
  html, body { background:transparent; }
  body { font-family:var(--sans); color:var(--txt); padding:3px; }

  .wrap {
    max-width:860px; margin:0 auto;
    display:flex; align-items:stretch;
    border-radius:14px; position:relative; overflow:hidden;
    background:var(--card);
    border:1px solid var(--bd);
    box-shadow:var(--sh);
    -webkit-backdrop-filter:blur(10px) saturate(150%); backdrop-filter:blur(10px) saturate(150%);
  }
  /* 상단 광택선 */
  .wrap::before {
    content:""; position:absolute; left:16px; right:16px; top:0; height:1px;
    background:var(--gloss); pointer-events:none;
  }

  /* 좌측 숫자 블록 */
  .left {
    padding:10px 17px 11px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px;
    border-right:1px solid var(--div);
    min-width:92px;
  }
  .cap { font-size:8.5px; font-weight:700; letter-spacing:1.6px; color:var(--txt3); }
  .num {
    font-family:var(--didone); font-size:29px; font-weight:500; line-height:.9;
    letter-spacing:-.5px; color:var(--txt); white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  /* 우측 정보 + 바 */
  .right { flex:1; padding:9px 15px 10px; display:flex; flex-direction:column; justify-content:center; gap:7px; min-width:0; }
  .l1 { font-size:11.5px; font-weight:700; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.2px; }
  .l1 .detail { font-weight:400; font-size:11px; color:var(--txt3); margin-left:8px; }
  .l1 .detail b { color:var(--txt2); font-weight:700; }
  .l1 .sep { color:var(--div); margin:0 5px; }

  .bar { height:4px; border-radius:999px; background:var(--track); position:relative; overflow:hidden; }
  .fill {
    position:absolute; left:0; top:0; height:100%; width:0%;
    border-radius:999px; background:var(--fill);
    transition:width 1s cubic-bezier(.4,0,.2,1);
  }

  @media (max-width: 560px) {
    /* 우측 여백: 노션 편집자 화면의 블록 메뉴(⋯)와 겹치지 않도록 */
    body { padding:2px 30px 2px 2px; }
    .left { padding:9px 12px 10px; min-width:74px; }
    .num { font-size:24px; }
    .right { padding:8px 11px 9px; gap:6px; }
    .l1 { font-size:10.5px; }
    .l1 .detail { font-size:9.5px; margin-left:5px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="cap" id="cap">진행률</div>
      <div class="num" id="pctNum">0%</div>
    </div>
    <div class="right">
      <div class="l1"><span id="title">공사 진행</span><span class="detail" id="detail"></span></div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
  </div>

<script>
  // 사용법 (착공~준공 날짜만 넣으면 매일 자동 갱신):
  //   ?start=2026-09-14&end=2026-11-13
  //   → 착공 전: "착공까지 D-N" / 착공 후: 진행률 %
  // 옵션:
  //   pct=42          수동 오버라이드
  //   t=공사 진행      제목 변경
  //   theme=light     밝은 카드로 전환 (기본은 다크 글래스 — 노션 테마와 무관하게 동일)
  const q = new URLSearchParams(location.search);
  const th = q.get("theme");
  if (th === "light") document.body.dataset.theme = "light";
  if (q.get("t")) document.getElementById("title").textContent = q.get("t");

  const startStr = q.get("start");
  const endStr = q.get("end");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const s = startStr ? new Date(startStr + "T00:00:00") : null;
  const e = endStr ? new Date(endStr + "T00:00:00") : null;
  const preStart = s && !isNaN(s) && today < s && !q.has("pct");

  let pct = 0;
  if (q.has("pct")) {
    pct = Math.max(0, Math.min(100, parseFloat(q.get("pct"))));
  } else if (s && e && !isNaN(s) && !isNaN(e) && e > s) {
    pct = Math.max(0, Math.min(100, Math.round(((today - s) / (e - s)) * 100)));
  }

  const pctEl = document.getElementById("pctNum");
  const capEl = document.getElementById("cap");
  if (preStart) {
    const dToStart = Math.round((s - today) / 86400000);
    capEl.textContent = "착공까지";
    pctEl.textContent = "D-" + dToStart;
  } else {
    capEl.textContent = "진행률";
    pctEl.textContent = pct + "%";
  }
  requestAnimationFrame(() => {
    document.getElementById("fill").style.width = pct + "%";
  });

  const fmt = (str) => {
    const d = new Date(str + "T00:00:00");
    return isNaN(d) ? "" : (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0");
  };
  let parts = [];
  if (startStr && endStr) parts.push(`착공 <b>${fmt(startStr)}</b> — 준공 예정 <b>${fmt(endStr)}</b>`);
  if (e && !isNaN(e)) {
    const left = Math.round((e - today) / 86400000);
    parts.push(left > 0 ? `준공까지 <b>${left}일</b>` : (left === 0 ? "<b>오늘 준공</b>" : "<b>준공 완료</b>"));
  }
  document.getElementById("detail").innerHTML = parts.join('<span class="sep">·</span>');
</script>
</body>
</html>
