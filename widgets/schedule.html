<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASIFILL Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&display=swap" rel="stylesheet">
<style>
/* ===== CAL:CSS:START ===== */
  .cal, .cal * { margin:0; padding:0; box-sizing:border-box; }

  /* 색은 .cal 에 붙습니다 — 한 페이지에 여러 개를 놓아도 서로 안 섞입니다 */
  .cal {
    --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    --serif:"Bodoni Moda",Didot,Georgia,"Times New Roman",serif;

    /* 밝은 노션 기준. 배경은 칠하지 않습니다 — 노션 종이가 그대로 비칩니다. */
    --ink:#16181d;                     /* 진행 중 · 오늘 */
    --ink2:rgba(22,24,29,.72);         /* 예정 */
    --ink3:rgba(22,24,29,.40);         /* 완료 · 보조 */
    --ink4:rgba(22,24,29,.24);         /* 요일 · 지난달 */
    --line:rgba(22,24,29,.11);
    --grid:rgba(22,24,29,.14);
    --soft:rgba(22,24,29,.055);        /* 예정 막대 속 */
    --softer:rgba(22,24,29,.028);      /* 완료 막대 속 */
    --rev:#fff;                        /* 진한 막대 위 글자 */
    --sun:#c0564f;

    font-family:var(--sans); color:var(--ink);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    background:transparent;

  }
  /* 기기가 어두우면 따라갑니다. ?theme=light 로 고정하면 그게 이깁니다. */
  @media (prefers-color-scheme: dark) {
    .cal:not([data-theme="light"]) {
      --ink:#f2f4f7; --ink2:rgba(242,244,247,.74); --ink3:rgba(242,244,247,.42);
      --ink4:rgba(242,244,247,.26); --line:rgba(242,244,247,.14); --grid:rgba(242,244,247,.20);
      --soft:rgba(242,244,247,.085); --softer:rgba(242,244,247,.04);
      --rev:#14161a; --sun:#e08b84;
    }
  }
  .cal[data-theme="dark"] {
    --ink:#f2f4f7; --ink2:rgba(242,244,247,.74); --ink3:rgba(242,244,247,.42);
    --ink4:rgba(242,244,247,.26); --line:rgba(242,244,247,.14); --grid:rgba(242,244,247,.20);
    --soft:rgba(242,244,247,.085); --softer:rgba(242,244,247,.04);
    --rev:#14161a; --sun:#e08b84;
  }
  .cal[data-theme="light"] {
    --ink:#16181d; --ink2:rgba(22,24,29,.72); --ink3:rgba(22,24,29,.40);
    --ink4:rgba(22,24,29,.24); --line:rgba(22,24,29,.11); --grid:rgba(22,24,29,.14);
    --soft:rgba(22,24,29,.055); --softer:rgba(22,24,29,.028);
    --rev:#fff; --sun:#c0564f;
  }

  .cal .head { display:flex; align-items:baseline; gap:9px; margin-bottom:2px; }
  .cal .mon { font-family:var(--serif); font-size:20px; font-weight:500; line-height:1.1; letter-spacing:-.2px; }
  .cal .mon .yr { font-size:11.5px; color:var(--ink3); margin-right:5px; letter-spacing:.2px; }
  .cal .grow { flex:1; }
  .cal .nav { display:flex; gap:3px; align-self:center; margin-left:10px; }
  /* 버튼을 왼쪽에 둡니다 — 오른쪽 위는 노션 embed 의 ⋯ 메뉴와 크기 손잡이 자리입니다 */
  /* 화살표만 있으면 눌러도 되는 건지 모릅니다. 글자를 붙입니다.
     폰에서는 자리가 없어 화살표만 남깁니다. */
  .cal .nav .lbl { margin:0 2px; }
  .cal.narrow .nav .lbl { display:none; }
  .cal .nav button {
    font-family:var(--sans); font-size:11px; color:var(--ink2); background:transparent;
    border:1px solid var(--line); border-radius:6px;
    height:23px; min-width:23px; padding:0 8px; cursor:pointer; line-height:1;
  }
  .cal .nav button:hover { border-color:var(--ink3); color:var(--ink); }
  .cal .nav button:focus-visible { outline:2px solid var(--ink3); outline-offset:1px; }

  /* 한 줄 요약 — 고객이 제일 먼저 보는 줄 */
  .cal .now {
    font-size:11.5px; color:var(--ink2); letter-spacing:-.2px;
    padding:0 0 9px; margin-bottom:9px; border-bottom:1px solid var(--line);
  }
  .cal .now b { color:var(--ink); font-weight:700; }
  .cal .now .dot {
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--ink); margin-right:6px; vertical-align:2px;
  }
  .cal .now .sep { color:var(--ink4); margin:0 7px; }
  /* 불러오는 동안 — 격자는 이미 보이고 이 줄만 숨 쉽니다 */
  .cal .now .waiting { color:var(--ink3); }
  .cal .now .dot.wait { background:var(--ink3); animation:calpulse 1.4s ease-in-out infinite; }
  @keyframes calpulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .cal .now .dot.wait { animation:none } }

  .cal .dow { display:grid; grid-template-columns:repeat(7,1fr); }
  .cal .dow span {
    font-size:9.5px; font-weight:600; letter-spacing:.7px; text-align:center;
    color:var(--ink4); padding-bottom:5px;
  }
  .cal .dow span:first-child { color:var(--sun); }

  .cal .week { position:relative; border-top:1px solid var(--line); padding:3px 0 4px; }
  /* 주마다 최소 높이를 줍니다. 안 주면 일정 없는 주가 한 줄로 납작해져
     달력 전체가 가로로만 긴 띠처럼 보입니다. 폰에서는 안 씁니다. */
  .cal:not(.narrow) .week { min-height:68px; }
  /* 세로 구분선. 가로줄만 있으면 넓은 화면에서 한 주가 7칸이 아니라
     띠 하나로 읽힙니다. 배경 그라디언트로 그렸더니 어두운 노션에서 흐려져
     안 보였습니다 — 진짜 테두리라야 1px 로 또렷하게 떨어집니다. */
  .cal .vgrid {
    position:absolute; inset:0; z-index:0; pointer-events:none;
    display:grid; grid-template-columns:repeat(7,1fr);
  }
  .cal .vgrid span { border-left:1px solid var(--grid); }
  .cal .vgrid span:first-child { border-left:0; }
  .cal.narrow .vgrid { display:none; }
  .cal .cells { position:relative; z-index:1; display:grid; grid-template-columns:repeat(7,1fr); }
  .cal .cell { text-align:center; }
  .cal .dnum { font-size:11.5px; color:var(--ink2); line-height:18px; display:inline-block; min-width:18px; }
  .cal .cell.out .dnum { color:var(--ink4); }
  .cal .cell.s0 .dnum { color:var(--sun); }
  .cal .cell.hol .dnum { color:var(--sun); }
  .cal .cell.out.s0 .dnum { color:var(--ink4); }
  .cal .cell.now .dnum {
    background:var(--ink); color:var(--rev); border-radius:50%;
    font-weight:700; width:18px; height:18px;
  }

  .cal .bars { position:relative; z-index:1; display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:2px; padding:0 2px; }
  .cal .bar {
    min-width:0; height:16px; line-height:16px; border-radius:3px;
    padding:0 5px; font-size:10px; font-weight:600; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cal .bar.plan { background:var(--soft); color:var(--ink2); }
  .cal .bar.live { background:var(--ink); color:var(--rev); font-weight:700; }
  .cal .bar.done { background:var(--softer); color:var(--ink3); }
  .cal .bar.off  { background:transparent; border:1px dashed var(--line); color:var(--ink3); font-weight:500; }
  /* 휴일은 달력의 일요일과 같은 빨강으로. 점선만으로는 미팅과 안 갈립니다 */
  .cal .bar.holi { border-color:var(--sun); color:var(--sun); font-weight:600; }
  .cal .bar.holi.done { opacity:.5; }
  .cal .bar.ship { background:var(--softer); color:var(--ink2); box-shadow:inset 2px 0 0 var(--ink3); }
  .cal .more { font-size:9px; color:var(--ink4); line-height:16px; padding-left:5px; }

  .cal .list { display:none; margin-top:10px; }
  .cal .li { display:flex; gap:9px; align-items:baseline; padding:5px 0; border-top:1px solid var(--line); }
  .cal .li .d { font-size:11px; color:var(--ink3); min-width:52px; white-space:nowrap; }
  .cal .li .nm { font-size:12px; font-weight:600; color:var(--ink2); letter-spacing:-.2px; }
  .cal .li.live .d, .cal .li.live .nm { color:var(--ink); font-weight:700; }
  .cal .li.done .nm, .cal .li.done .d { color:var(--ink3); font-weight:500; }
  .cal .li .tag { font-size:9.5px; color:var(--ink4); margin-left:6px; font-weight:500; }

  .cal .note { font-size:11.5px; color:var(--ink3); text-align:center; padding:28px 10px; line-height:1.7; }
  .cal .note b { color:var(--ink2); display:block; margin-bottom:3px; }

  /* 넓을 때 — 폭만 넓히면 글자가 상대적으로 작아 보입니다. 같이 키웁니다. */
  .cal.wide .mon { font-size:25px; }
  .cal.wide .mon .yr { font-size:13px; }
  .cal.wide .nav button { height:26px; min-width:26px; font-size:12px; }
  .cal.wide .now { font-size:13px; padding-bottom:12px; margin-bottom:12px; }
  .cal.wide .now .dot { width:6px; height:6px; }
  .cal.wide .dow span { font-size:10.5px; padding-bottom:7px; }
  .cal.wide .week { padding:9px 0 12px; min-height:104px; }
  .cal.wide .dnum { font-size:13.5px; line-height:22px; min-width:22px; }
  .cal.wide .cell.now .dnum { width:22px; height:22px; }
  .cal.wide .bars { gap:3px; margin-top:4px; }
  .cal.wide .bar { height:20px; line-height:20px; font-size:11.5px; border-radius:4px; padding:0 7px; }
  .cal.wide .more { line-height:20px; font-size:10px; }

  /* 좁을 때 — 달력은 띠만, 아래에 목록.
     화면 너비가 아니라 .cal 상자의 너비로 판단하게 「narrow」를 붙입니다. */
  .cal.narrow .dnum { font-size:10.5px; }
  .cal.narrow .bar { height:5px; padding:0; font-size:0; border-radius:2px; }
  .cal.narrow .bar.off { border-style:dotted; }
  .cal.narrow .more { display:none; }
  .cal.narrow .list { display:block; }
  .cal.narrow .mon { font-size:17px; }
  .cal.narrow .now { font-size:11px; }
/* ===== CAL:CSS:END ===== */

  html { color-scheme: light dark; }
  html, body { background:transparent; margin:0; padding:0; }
  body { padding:2px 2px 4px; }
</style>
</head>
<body>
<div class="cal" id="cal"></div>

<script>
/* ===== CAL:JS:START =====
 * 달력 한 개를 상자 안에 그립니다. 한 페이지에 여러 개 놓아도 서로 안 섞입니다.
 *   달력만들기(상자, 일정목록)
 * 일정 한 건 = { n:이름, s:시작 YYYY-MM-DD, e:종료, p:공정, g:구분, d:지연이면 1 }
 *
 * 옵션.대기 = true 면 「틀만」 그립니다 — 이번 달 격자와 날짜까지만.
 * 서버가 1.7초쯤 걸리는데 그동안 글자만 띄워두면 화면이 멈춘 것처럼 보입니다.
 * 격자는 자료 없이도 즉시 그릴 수 있으니 먼저 띄우고 막대만 나중에 채웁니다.
 */
function 달력만들기(상자, 일정, 옵션) {
  옵션 = 옵션 || {};
  var 대기 = !!옵션.대기;
  var 오늘 = new Date(); 오늘.setHours(0,0,0,0);
  var 오늘str = ymd(오늘);
  var 공사아님 = { '행정':1, '미팅':1, '검수':1 };

  // 휴일은 「구분」에 따로 없고 행정에 섞여 들어옵니다 (추석연휴 · 한글날(공휴일) · 대체휴무일).
  // 점선만으로는 미팅과 안 갈려서, 달력의 일요일과 같은 빨강으로 맞춥니다.
  var 휴일말 = /휴일|연휴|휴무|공휴|명절/;
  function 휴일인가(x){ return x.g === '휴일' || 휴일말.test(x.n || ''); }
  var 보는달;

  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function 날짜(s){ return new Date(s+'T00:00:00'); }
  function 더하기(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function 짧은날(s){ var d=날짜(s); return (d.getMonth()+1)+'.'+String(d.getDate()).padStart(2,'0'); }

  function 상태(x){
    // 대표님이 「지연」으로 표시한 건 날짜가 지나도 완료로 치지 않습니다.
    // 안 끝난 공정을 고객에게 끝났다고 보여주면 안 됩니다.
    if (x.d) return (x.s <= 오늘str && 오늘str <= x.e) ? 'live' : 'plan';
    if (x.e < 오늘str) return 'done';
    if (x.s <= 오늘str && 오늘str <= x.e) return 'live';
    return 'plan';
  }
  function 모양(x){
    var st = 상태(x);
    if (휴일인가(x)) return 'off holi' + (st==='done' ? ' done' : '');
    if (공사아님[x.g]) return 'off' + (st==='done' ? ' done' : '');
    if (x.g === '납품') return st==='live' ? 'live' : (st==='done' ? 'ship done' : 'ship');
    return st;
  }

  상자.innerHTML =
    '<div class="head">'
  +   '<div class="mon js-mon"></div>'
  +   '<div class="nav">'
  +     '<button class="js-prev" type="button" aria-label="지난 달">‹<span class="lbl">지난 달</span></button>'
  +     '<button class="js-today" type="button">오늘</button>'
  +     '<button class="js-next" type="button" aria-label="다음 달"><span class="lbl">다음 달</span>›</button>'
  +   '</div>'
  +   '<div class="grow"></div>'
  + '</div>'
  + '<div class="now js-now"></div>'
  + '<div class="js-body"></div>';

  var 몸통 = 상자.querySelector('.js-body');

  /* 상자 너비로 판단합니다 — 화면 너비가 아니라. 노션 임베드 안에서도 맞습니다.
       좁으면(폰) 띠+목록, 넓으면(넓게 보기) 글자와 막대를 키웁니다. */
  function 너비맞추기(){
    var w = 상자.clientWidth || 상자.offsetWidth;
    if (!w) return;
    상자.classList.toggle('narrow', w < 520);
    상자.classList.toggle('wide', w >= 820);
  }

  function 윗줄(){
    if (대기) {
      상자.querySelector('.js-now').innerHTML =
        '<span class="dot wait"></span><span class="waiting">'
        + (옵션.문구 || '일정을 불러오는 중입니다') + '</span>';
      return;
    }
    var 진행 = 일정.filter(function(x){ return 상태(x)==='live'; });
    var 다음 = 일정.filter(function(x){ return x.s > 오늘str; })
                   .sort(function(a,b){ return a.s<b.s?-1:1; });
    var 조각 = [];
    if (진행.length) {
      조각.push('<span class="dot"></span>오늘 <b>' + 진행.map(function(x){return x.n;}).join(', ') + '</b>');
    } else {
      조각.push('<span class="dot" style="background:var(--ink4)"></span>오늘은 예정된 공정이 없습니다');
    }
    if (다음.length) {
      var d = Math.round((날짜(다음[0].s) - 오늘)/86400000);
      조각.push('다음 <b>' + 짧은날(다음[0].s) + ' ' + 다음[0].n + '</b> · D-' + d);
    }
    상자.querySelector('.js-now').innerHTML = 조각.join('<span class="sep">·</span>');
  }

  function 첫달(){
    if (!일정.length) return new Date(오늘.getFullYear(), 오늘.getMonth(), 1);
    var 끝 = 일정.reduce(function(m,x){ return x.e>m ? x.e : m; }, 일정[0].e);
    if (오늘str <= 끝) return new Date(오늘.getFullYear(), 오늘.getMonth(), 1);
    var d = 날짜(일정[0].s); return new Date(d.getFullYear(), d.getMonth(), 1);
  }

  function 그리기(){
    너비맞추기();
    쉬는날모으기();
    var y=보는달.getFullYear(), m=보는달.getMonth();
    상자.querySelector('.js-mon').innerHTML = '<span class="yr">'+y+'</span>'+(m+1)+'월';
    var 달시작=ymd(new Date(y,m,1)), 달끝=ymd(new Date(y,m+1,0));
    var 이달=일정.filter(function(x){ return x.e>=달시작 && x.s<=달끝; });

    몸통.innerHTML='';
    // 대기 중에 「일정이 없습니다」를 띄우면 거짓말이 됩니다. 격자만 그립니다.
    if(!대기 && !이달.length){
      몸통.innerHTML='<div class="note"><b>이 달에는 예정된 일정이 없습니다</b>‹ › 로 다른 달을 보실 수 있습니다</div>';
      return;
    }
    몸통.appendChild(달력(y,m));
    if(!대기) 몸통.appendChild(목록(이달));
  }

  function 달력(y,m){
    var f=document.createDocumentFragment();
    var 요일=document.createElement('div'); 요일.className='dow';
    ['일','월','화','수','목','금','토'].forEach(function(s){
      var e=document.createElement('span'); e.textContent=s; 요일.appendChild(e);
    });
    f.appendChild(요일);
    var 첫날=new Date(y,m,1), 커서=더하기(첫날,-첫날.getDay()), 달끝=new Date(y,m+1,0);
    while(true){
      var 주시작=new Date(커서), 주끝=더하기(주시작,6);
      f.appendChild(한주(주시작,주끝,m));
      if(ymd(주끝)>=ymd(달끝)) break;
      커서=더하기(커서,7);
    }
    return f;
  }

  // 휴일에 걸친 날짜를 미리 모읍니다. 칸마다 일정을 훑으면 달을 넘길 때 버벅입니다.
  var 쉬는날 = {};
  function 쉬는날모으기(){
    쉬는날 = {};
    일정.forEach(function(x){
      if (!휴일인가(x) || !x.s) return;
      for (var d=날짜(x.s), 끝=날짜(x.e||x.s); d<=끝; d=더하기(d,1)) 쉬는날[ymd(d)] = 1;
    });
  }

  function 한주(주시작,주끝,이달월){
    var 주=document.createElement('div'); 주.className='week';

    var 격자=document.createElement('div'); 격자.className='vgrid';
    for(var g=0;g<7;g++) 격자.appendChild(document.createElement('span'));
    주.appendChild(격자);

    var 칸들=document.createElement('div'); 칸들.className='cells';
    for(var i=0;i<7;i++){
      var d=더하기(주시작,i), s=ymd(d);
      var c=document.createElement('div');
      c.className='cell s'+i+(d.getMonth()!==이달월?' out':'')+(s===오늘str?' now':'')
        +(쉬는날[s]?' hol':'');
      var n=document.createElement('div'); n.className='dnum'; n.textContent=d.getDate();
      c.appendChild(n); 칸들.appendChild(c);
    }
    주.appendChild(칸들);

    var a=ymd(주시작), b=ymd(주끝);
    var 걸친것=일정.filter(function(x){ return x.e>=a && x.s<=b; }).map(function(x){
      return { x:x,
        st: x.s<a ? 0 : Math.round((날짜(x.s)-주시작)/86400000),
        en: x.e>b ? 6 : Math.round((날짜(x.e)-주시작)/86400000) };
    }).sort(function(p,r){
      if(p.st!==r.st) return p.st-r.st;
      return (r.en-r.st)-(p.en-p.st);
    });

    var 레인=[], 넘침=[0,0,0,0,0,0,0];
    var 최대 = 상자.classList.contains('narrow') ? 4 : 3;
    걸친것.forEach(function(it){
      var L=0;
      for(;L<최대;L++){
        if(!레인[L]) 레인[L]=[];
        if(!레인[L].some(function(o){ return !(it.en<o.st || it.st>o.en); })) break;
      }
      if(L>=최대){ for(var i=it.st;i<=it.en;i++) 넘침[i]++; return; }
      레인[L].push(it); it.lane=L;
    });

    if(레인.length){
      var 막대들=document.createElement('div'); 막대들.className='bars';
      걸친것.forEach(function(it){
        if(it.lane===undefined) return;
        var el=document.createElement('div');
        el.className='bar '+모양(it.x);
        el.style.gridColumn=(it.st+1)+' / '+(it.en+2);
        el.style.gridRow=(it.lane+1);
        el.title=it.x.n;
        el.textContent=(상태(it.x)==='done' ? '✓ ' : '')+it.x.n;
        막대들.appendChild(el);
      });
      for(var i=0;i<7;i++){
        if(!넘침[i]) continue;
        var mo=document.createElement('div'); mo.className='more'; mo.textContent='+'+넘침[i];
        mo.style.gridColumn=(i+1)+' / '+(i+2); mo.style.gridRow=레인.length;
        막대들.appendChild(mo);
      }
      주.appendChild(막대들);
    }
    return 주;
  }

  function 목록(이달){
    var 통=document.createElement('div'); 통.className='list';
    이달.slice().sort(function(p,r){ return p.s<r.s?-1:1; }).forEach(function(x){
      var st=상태(x);
      var row=document.createElement('div'); row.className='li '+st;
      var a=날짜(x.s), b=날짜(x.e);
      var 짧=function(t){ return String(t.getDate()).padStart(2,'0'); };
      var 긴=function(t){ return (t.getMonth()+1)+'.'+짧(t); };
      var d=document.createElement('div'); d.className='d';
      d.textContent=긴(a)+(x.e===x.s ? '' : '–'+(a.getMonth()===b.getMonth() ? 짧(b) : 긴(b)));
      row.appendChild(d);
      var nm=document.createElement('div'); nm.className='nm';
      nm.textContent=(st==='done' ? '✓ ' : '')+x.n;
      if(x.p||x.g){ var t=document.createElement('span'); t.className='tag'; t.textContent=x.p||x.g; nm.appendChild(t); }
      row.appendChild(nm);
      통.appendChild(row);
    });
    return 통;
  }

  상자.querySelector('.js-prev').onclick  = function(){ 보는달=new Date(보는달.getFullYear(),보는달.getMonth()-1,1); 그리기(); };
  상자.querySelector('.js-next').onclick  = function(){ 보는달=new Date(보는달.getFullYear(),보는달.getMonth()+1,1); 그리기(); };
  상자.querySelector('.js-today').onclick = function(){ 보는달=new Date(오늘.getFullYear(),오늘.getMonth(),1); 그리기(); };
  window.addEventListener('resize', 그리기);

  if(!대기 && !일정.length){
    상자.querySelector('.js-now').textContent='';
    몸통.innerHTML='<div class="note"><b>등록된 일정이 없습니다</b>일정이 잡히면 이곳에 표시됩니다</div>';
    return;
  }
  윗줄(); 보는달=첫달(); 그리기();
}

function 알림상자(상자, 제목, 설명) {
  상자.innerHTML='<div class="note"><b></b><span></span></div>';
  상자.querySelector('b').textContent=제목;
  상자.querySelector('span').textContent=설명;
}
/* ===== CAL:JS:END ===== */

/* ===== 실제 위젯 — 서버에서 일정을 받아 그립니다 =====
 *   ?site=<현장 페이지 id>&api=<Apps Script /exec 주소>
 *   theme=light|dark 를 붙이면 기기 테마와 상관없이 고정됩니다.
 */
(function () {
  var 상자 = document.getElementById('cal');
  var q = new URLSearchParams(location.search);
  var th = q.get('theme');
  if (th === 'light' || th === 'dark') 상자.dataset.theme = th;

  var SITE = (q.get('site') || '').replace(/-/g, '');
  var API = q.get('api') || '';
  if (!SITE || !API) { 알림상자(상자, '주소가 덜 채워졌습니다', 'site 와 api 값이 필요합니다'); return; }

  // 격자를 먼저 띄웁니다. 서버는 1.7초쯤 걸리는데 그동안 글자만 보이면
  // 화면이 멈춘 것처럼 읽힙니다. 이번 달 날짜는 자료 없이도 그릴 수 있습니다.
  달력만들기(상자, [], { 대기: true });
  var 늦음 = setTimeout(function () {
    달력만들기(상자, [], { 대기: true, 문구: '불러오는 데 시간이 걸리고 있습니다 — 잠시 후 새로고침해 주세요' });
  }, 9000);

  fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + 'cal=' + SITE)
    .then(function (r) { return r.json(); })
    .then(function (r) {
      clearTimeout(늦음);
      if (!r || !r.ok) throw new Error((r && r.error) || 'no data');
      달력만들기(상자, (r.items || []).filter(function (x) { return x && x.s; }));
    })
    .catch(function () {
      // 조용히 빈 달력을 보여주면 아무도 실패한 걸 모릅니다.
      clearTimeout(늦음);
      알림상자(상자, '공정표를 불러오지 못했습니다', '잠시 후 새로고침해 주세요');
    });
})();
</script>
